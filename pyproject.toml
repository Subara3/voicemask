[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemask"
version = "0.1.0"
description = "通話録音の個人情報を、文字と音声の両方から伏せてから保存・LLMに渡す中継処理（AmiVoice API）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "amivoice-api-client>=1.0.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "requests>=2.31",
  "faker>=24",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ner = ["ginza>=5.3", "ja_ginza>=5.3"]
llm = ["anthropic>=2.0"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
voicemask = "voicemask.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
